<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI × Human Flourishing — Ecosystem Atlas</title>
<style>
  :root{
    --bg:#F7F9FA; --surface:#FFFFFF; --ink:#13272E; --muted:#63797F; --faint:#9AB0B5;
    --hair:#E3EAEC; --hair2:#D3DEE0; --accent:#0D9488; --accent-soft:rgba(13,148,136,.08);
    --danger:#C2455A; --shadow:0 10px 40px rgba(19,39,46,.10),0 1px 3px rgba(19,39,46,.06);
    --sans:-apple-system,"SF Pro Text","Segoe UI",system-ui,"Helvetica Neue",sans-serif;
  }
  @media(prefers-color-scheme:dark){:root{
    --bg:#0B1214; --surface:#121B1E; --ink:#E9F2F3; --muted:#8FA5AB; --faint:#5A6E74;
    --hair:#1F2C31; --hair2:#2B3B41; --accent:#2DD4BF; --accent-soft:rgba(45,212,191,.09);
    --danger:#F08096; --shadow:0 10px 40px rgba(0,0,0,.5),0 1px 3px rgba(0,0,0,.4);
  }}
  :root[data-theme="light"]{
    --bg:#F7F9FA; --surface:#FFFFFF; --ink:#13272E; --muted:#63797F; --faint:#9AB0B5;
    --hair:#E3EAEC; --hair2:#D3DEE0; --accent:#0D9488; --accent-soft:rgba(13,148,136,.08);
    --danger:#C2455A; --shadow:0 10px 40px rgba(19,39,46,.10),0 1px 3px rgba(19,39,46,.06);
  }
  :root[data-theme="dark"]{
    --bg:#0B1214; --surface:#121B1E; --ink:#E9F2F3; --muted:#8FA5AB; --faint:#5A6E74;
    --hair:#1F2C31; --hair2:#2B3B41; --accent:#2DD4BF; --accent-soft:rgba(45,212,191,.09);
    --danger:#F08096; --shadow:0 10px 40px rgba(0,0,0,.5),0 1px 3px rgba(0,0,0,.4);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);overflow:hidden;
       -webkit-font-smoothing:antialiased}
  canvas#net{position:fixed;inset:0;display:block;cursor:grab}
  canvas#net.grabbing{cursor:grabbing}
  canvas#net.pointing{cursor:pointer}

  .eyebrow{font-size:10px;font-weight:600;letter-spacing:.18em;color:var(--accent);
           text-transform:uppercase}

  header{position:fixed;top:0;left:0;right:0;padding:20px 24px;display:flex;
         justify-content:space-between;align-items:flex-start;gap:16px;pointer-events:none;z-index:20}
  .titleblock{pointer-events:auto}
  .titleblock h1{font-size:19px;font-weight:650;letter-spacing:-.01em;margin-top:5px}
  .stats{font-size:11.5px;color:var(--muted);margin-top:4px}
  .controls{pointer-events:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap;
            justify-content:flex-end}
  .search{position:relative}
  .search input{width:220px;background:var(--surface);border:1px solid var(--hair2);
    border-radius:9px;padding:8px 12px 8px 32px;color:var(--ink);font-family:var(--sans);
    font-size:12.5px;outline:none;transition:border-color .2s,width .25s,box-shadow .2s}
  .search input:focus{border-color:var(--accent);width:260px;box-shadow:0 0 0 3px var(--accent-soft)}
  .search input::placeholder{color:var(--faint)}
  .search svg{position:absolute;left:11px;top:50%;translate:0 -50%;opacity:.55}
  .btn{background:var(--surface);border:1px solid var(--hair2);border-radius:9px;
    color:var(--ink);font-family:var(--sans);font-size:12px;font-weight:550;
    padding:8px 14px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;
    transition:.18s;white-space:nowrap}
  .btn:hover{border-color:var(--accent);color:var(--accent)}
  .btn:focus-visible,.search input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  :root[data-theme="dark"] .btn.primary,body .btn.primary{color:#fff}
  @media(prefers-color-scheme:dark){.btn.primary{color:#06211D}}
  :root[data-theme="dark"] .btn.primary{color:#06211D}
  :root[data-theme="light"] .btn.primary{color:#fff}
  .btn.primary:hover{filter:brightness(1.06);color:inherit}
  .btn.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 35%,transparent)}
  .btn.danger:hover{border-color:var(--danger)}

  #legend{position:fixed;left:24px;bottom:22px;z-index:20;background:var(--surface);
    border:1px solid var(--hair);border-radius:12px;padding:12px 14px;box-shadow:var(--shadow)}
  #legend .eyebrow{color:var(--muted);display:block;margin-bottom:8px;letter-spacing:.14em}
  .lrow{display:flex;align-items:center;gap:8px;font-size:11.5px;font-weight:500;
    color:var(--ink);padding:3px 0;cursor:pointer;user-select:none;background:none;border:0;
    width:100%;text-align:left;font-family:var(--sans)}
  .lrow:hover{color:var(--accent)}
  .lrow.off{opacity:.3;text-decoration:line-through}
  .ldot{width:8px;height:8px;border-radius:50%;flex:none}
  .licon{width:16px;height:16px;flex:none}
  .lrow .n{margin-left:auto;color:var(--faint);padding-left:16px;font-variant-numeric:tabular-nums}
  #legendHint{font-size:10px;color:var(--faint);margin-top:7px}

  #editDock{position:fixed;right:24px;bottom:22px;z-index:20;display:none;flex-direction:column;
    gap:8px;align-items:flex-end}
  #editDock.on{display:flex}

  #panel{position:fixed;top:0;right:0;bottom:0;width:min(400px,100vw);z-index:30;
    background:var(--surface);border-left:1px solid var(--hair);box-shadow:var(--shadow);
    transform:translateX(105%);transition:transform .3s cubic-bezier(.2,.8,.2,1);
    display:flex;flex-direction:column}
  #panel.open{transform:none}
  #panelScroll{overflow-y:auto;padding:24px 24px 40px;flex:1;scrollbar-width:thin;
    scrollbar-color:var(--hair2) transparent}
  .pclose{position:absolute;top:14px;right:14px;background:none;border:0;color:var(--muted);
    cursor:pointer;font-size:15px;padding:8px;line-height:1;border-radius:8px;z-index:2}
  .pclose:hover{color:var(--ink);background:var(--accent-soft)}
  .chip{display:inline-flex;align-items:center;gap:7px;font-size:10px;font-weight:650;
    letter-spacing:.12em;text-transform:uppercase;padding:4px 10px;border-radius:999px;
    margin-bottom:13px;color:#fff}
  .chiprow{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
  .chiprow .chip{margin-bottom:0}
  #panel h2{font-size:20px;font-weight:650;letter-spacing:-.01em;text-wrap:balance;
    padding-right:20px}
  .ploc{font-size:11.5px;color:var(--muted);margin-top:8px;display:flex;align-items:center;gap:6px}
  .pdesc{font-size:13.5px;line-height:1.65;color:var(--ink);opacity:.85;margin-top:14px;max-width:62ch}
  .sect{margin-top:22px}
  .sect .eyebrow{color:var(--muted);letter-spacing:.14em;display:block;margin-bottom:9px}
  .tags{display:flex;flex-wrap:wrap;gap:6px}
  .tag{font-size:11px;font-weight:500;color:var(--accent);background:var(--accent-soft);
    border-radius:6px;padding:4px 9px}
  .tag.kw{color:var(--muted);background:color-mix(in srgb,var(--muted) 9%,transparent)}
  .areatag{cursor:pointer;border:0;font-family:var(--sans);font-weight:600}
  .areatag:hover{filter:brightness(1.12)}
  .checks{display:grid;grid-template-columns:1fr 1fr;gap:5px 10px}
  .check{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--ink);cursor:pointer}
  .check input{accent-color:var(--accent)}
  .people{display:flex;flex-wrap:wrap;gap:6px}
  .person{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:500;color:var(--ink);
    border:1px solid var(--hair);border-radius:999px;padding:4px 11px 4px 5px}
  .avatar{width:21px;height:21px;border-radius:50%;flex:none;display:grid;place-items:center;
    font-size:8.5px;color:#fff;font-weight:700}
  .rowlist{display:flex;flex-direction:column;gap:6px}
  .rowitem{display:flex;align-items:center;gap:10px;background:none;
    border:1px solid var(--hair);border-radius:10px;padding:9px 12px;cursor:pointer;
    transition:.16s;text-align:left;color:var(--ink);font-family:var(--sans);width:100%}
  .rowitem:hover{border-color:var(--accent);background:var(--accent-soft)}
  .rowitem .rdot{width:7px;height:7px;border-radius:50%;flex:none}
  .rowitem .rname{font-size:12.5px;font-weight:550}
  .rowitem .rsub{font-size:10.5px;color:var(--muted);margin-top:1px}
  .rowitem .rx{margin-left:auto;color:var(--faint);background:none;border:0;cursor:pointer;
    font-size:13px;padding:4px 6px;border-radius:6px}
  .rowitem .rx:hover{color:var(--danger)}
  .plink{font-size:12px;font-weight:500;color:var(--accent);text-decoration:none;word-break:break-all}
  .plink:hover{text-decoration:underline}
  .pactions{display:flex;gap:8px;flex-wrap:wrap;margin-top:24px;padding-top:16px;
    border-top:1px solid var(--hair)}
  .crumb{font-size:11px;font-weight:550;color:var(--muted);margin-bottom:12px;background:none;
    border:0;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-family:var(--sans)}
  .crumb:hover{color:var(--accent)}

  #scrim{position:fixed;inset:0;background:color-mix(in srgb,var(--ink) 32%,transparent);
    z-index:40;display:none;align-items:center;justify-content:center;padding:20px}
  #scrim{z-index:80}
  #scrim.open{display:flex}
  #modal{width:min(440px,100%);max-height:86vh;overflow-y:auto;background:var(--surface);
    border:1px solid var(--hair);border-radius:14px;padding:24px;box-shadow:var(--shadow)}
  #modal.shake{animation:shake .4s}
  @keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
  #modal h3{font-size:15.5px;font-weight:650;margin:8px 0 4px}
  #modal .sub{font-size:12px;color:var(--muted);line-height:1.55;margin-bottom:14px}
  .field{margin-bottom:12px}
  .field label{display:block;font-size:10px;font-weight:600;letter-spacing:.12em;
    text-transform:uppercase;color:var(--muted);margin-bottom:5px}
  .field input,.field textarea,.field select{width:100%;background:var(--bg);
    border:1px solid var(--hair2);border-radius:8px;color:var(--ink);
    font-size:13px;font-family:var(--sans);padding:8px 11px;outline:none;transition:.18s}
  .field textarea{min-height:74px;resize:vertical;line-height:1.5}
  .field input:focus,.field textarea:focus,.field select:focus{border-color:var(--accent);
    box-shadow:0 0 0 3px var(--accent-soft)}
  .ferr{color:var(--danger);font-size:11.5px;font-weight:500;margin-top:8px;display:none}
  .mrow{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}

  #toast{position:fixed;bottom:26px;left:50%;translate:-50% 0;z-index:60;background:var(--ink);
    color:var(--bg);font-size:12px;font-weight:550;padding:10px 18px;border-radius:9px;
    opacity:0;pointer-events:none;transition:opacity .3s,translate .3s;box-shadow:var(--shadow)}
  #toast.show{opacity:1;translate:-50% -6px}

  #hint{position:fixed;bottom:22px;left:50%;translate:-50% 0;z-index:10;font-size:11px;
    color:var(--faint);pointer-events:none;transition:opacity 1s}

  /* ---------- full-screen overlay (table / pathway views) ---------- */
  #overlay{position:fixed;inset:0;z-index:50;background:var(--bg);display:none;flex-direction:column}
  #overlay.open{display:flex}
  #overlayHead{display:flex;align-items:flex-start;gap:16px;padding:18px 24px;
    border-bottom:1px solid var(--hair);flex:none}
  #overlayHead h2{font-size:18px;font-weight:650;letter-spacing:-.01em;margin-top:3px}
  #overlayHead .eyebrow{color:var(--accent)}
  #overlayTools{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  #overlayBody{flex:1;overflow:auto;padding:20px 24px 60px}

  /* table view */
  .tbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
  .tbar input,.tbar select{background:var(--surface);border:1px solid var(--hair2);border-radius:8px;
    color:var(--ink);font-family:var(--sans);font-size:12.5px;padding:7px 11px;outline:none}
  .tbar input:focus,.tbar select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .tcount{font-size:12px;color:var(--muted);margin-left:auto}
  table.otable{width:100%;border-collapse:collapse;font-size:12.5px}
  table.otable th{text-align:left;font-size:10px;font-weight:650;letter-spacing:.1em;
    text-transform:uppercase;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--hair2);
    position:sticky;top:0;background:var(--bg);cursor:pointer;user-select:none;white-space:nowrap}
  table.otable th:hover{color:var(--accent)}
  table.otable td{padding:9px 10px;border-bottom:1px solid var(--hair);vertical-align:middle}
  table.otable tr:hover td{background:var(--accent-soft)}
  .oname{font-weight:600;cursor:pointer}
  .oname:hover{color:var(--accent)}
  .rolepills{display:flex;flex-wrap:wrap;gap:4px}
  .rolepill{font-size:9.5px;font-weight:650;letter-spacing:.03em;color:#fff;border-radius:999px;
    padding:2px 8px;white-space:nowrap}
  .areapill{font-size:9.5px;font-weight:600;border-radius:999px;padding:2px 8px;white-space:nowrap}
  .tnum{font-variant-numeric:tabular-nums;text-align:center}
  .ticon{background:none;border:0;cursor:pointer;color:var(--muted);padding:4px 6px;border-radius:6px;font-size:13px}
  .ticon:hover{color:var(--accent)}
  .ticon.del:hover{color:var(--danger)}

  /* pathway view */
  .pathgrid{display:flex;gap:14px;align-items:stretch;min-width:min-content;padding-bottom:12px}
  .pathcol{flex:1;min-width:190px;max-width:240px;background:var(--surface);border:1px solid var(--hair);
    border-radius:14px;display:flex;flex-direction:column;overflow:hidden}
  .pathcol h3{font-size:12.5px;font-weight:700;padding:12px 14px 4px;display:flex;align-items:center;gap:8px}
  .pathcol .stagesub{font-size:10.5px;color:var(--muted);padding:0 14px 10px}
  .pathcol .stagestat{font-size:10px;color:var(--muted);padding:0 14px 10px;font-variant-numeric:tabular-nums}
  .pathlist{display:flex;flex-direction:column;gap:6px;padding:0 10px 12px;overflow-y:auto}
  .pathitem{display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:9px;
    border:1px solid var(--hair);cursor:pointer;background:var(--bg);transition:.15s;text-align:left;
    font-family:var(--sans);color:var(--ink);width:100%}
  .pathitem:hover,.pathitem.hot{border-color:var(--accent);background:var(--accent-soft)}
  .pathitem.dim{opacity:.32}
  .pathitem .pdot{width:8px;height:8px;border-radius:50%;flex:none}
  .pathitem .pnm{font-size:11.5px;font-weight:600;line-height:1.25}
  .pathitem .pj{margin-left:auto;font-size:10px;font-weight:700;color:var(--accent);
    background:var(--accent-soft);border-radius:999px;padding:2px 7px;font-variant-numeric:tabular-nums}
  .pathstep{align-self:center;color:var(--faint);flex:none;display:flex;align-items:center}
  .pathnote{font-size:11.5px;color:var(--muted);margin-bottom:14px;max-width:80ch;line-height:1.55}
  @media(max-width:760px){#overlayHead{flex-wrap:wrap}.pathcol{min-width:160px}}

  @media(max-width:760px){
    header{padding:14px}
    .search input{width:140px}.search input:focus{width:160px}
    #legend{left:12px;bottom:12px;padding:10px 12px}
    #legendHint{display:none}
    #editDock{right:12px;bottom:12px}
    #hint{display:none}
  }
  @media(prefers-reduced-motion:reduce){
    *{transition-duration:.01ms!important;animation-duration:.01ms!important}
  }
</style>

<canvas id="net" aria-label="Network map of organizations working on AI and human flourishing"></canvas>

<header>
  <div class="titleblock">
    <span class="eyebrow">Ecosystem Atlas</span>
    <h1>AI × Human Flourishing</h1>
    <div class="stats" id="stats"></div>
  </div>
  <div class="controls">
    <div class="search">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
        <circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <input id="q" type="search" placeholder="Search the network" autocomplete="off">
    </div>
    <button class="btn" id="pathwayBtn" title="View the pathway from funding to impact">Pathway to impact</button>
    <button class="btn" id="tableBtn" title="Edit organizations in a table" style="display:none">Table editor</button>
    <button class="btn" id="ringBtn" title="Show or hide the flourishing-areas ring">Hide ring</button>
    <button class="btn" id="projBtn" title="Show or hide project nodes">Hide projects</button>
    <button class="btn" id="exportBtn" title="Download the dataset as JSON">Export</button>
    <button class="btn" id="editBtn"><span id="editLbl">Edit</span></button>
  </div>
</header>

<div id="legend" role="group" aria-label="Filter by ecosystem role"></div>

<div id="editDock">
  <button class="btn primary" id="addOrgBtn">＋ Add organization</button>
  <button class="btn" id="resetBtn">Reset to seed data</button>
</div>

<aside id="panel" aria-live="polite">
  <button class="pclose" id="pclose" aria-label="Close panel">✕</button>
  <div id="panelScroll"></div>
</aside>

<div id="overlay" role="dialog" aria-modal="true">
  <div id="overlayHead">
    <div><span class="eyebrow" id="ovEyebrow">View</span><h2 id="ovTitle"></h2></div>
    <div id="overlayTools"></div>
    <button class="btn" id="ovClose">✕ Close</button>
  </div>
  <div id="overlayBody"></div>
</div>

<div id="scrim"><div id="modal" role="dialog" aria-modal="true"></div></div>
<div id="toast" role="status"></div>
<div id="hint">Drag to explore · scroll to zoom · click any node</div>

<script>
'use strict';
/* ============================== roles ============================== */
const ROLES = {
  hub:       {label:'Interdisciplinary Research to Impact Hub', c:{light:'#0D9488',dark:'#2DD4BF'},
              icon:'M12 2l2 8 8 2-8 2-2 8-2-8-8-2 8-2z',
              desc:'The convening center of the movement — multi-institution research programs anchoring the field.'},
  academic:  {label:'Academic Research',     c:{light:'#2563EB',dark:'#5EA0F6'},
              icon:'M12 4l10 5-10 5L2 9z M6 11v5c2 1.5 10 1.5 12 0v-5',
              desc:'Universities and research centers building the evidence base on AI, wellbeing, and flourishing.'},
  industry:  {label:'Industry Labs',         c:{light:'#7C3AED',dark:'#A78BFA'},
              icon:'M6 6h12v12H6z M9 3v3M15 3v3M9 18v3M15 18v3M3 9h3M3 15h3M18 9h3M18 15h3',
              desc:'AI companies and labs studying — and shaping — how their systems affect the people who use them.'},
  civil:     {label:'Civil Society',         c:{light:'#059669',dark:'#34D399'},
              icon:'M8 11a3 3 0 1 0 0-6 3 3 0 0 0 0 6z M2 20c0-3.3 2.7-6 6-6s6 2.7 6 6 M16 5a3 3 0 0 1 0 6 M17 14c2.5 0 5 2 5 6',
              desc:'Nonprofits and advocacy groups pushing technology toward the public interest.'},
  measure:   {label:'Measurement & Data',    c:{light:'#0891B2',dark:'#22D3EE'},
              icon:'M3 21h18 M6 21v-6 M12 21v-11 M18 21v-16',
              desc:'Organizations building the instruments — surveys, benchmarks, open data — that make flourishing measurable.'},
  funder:    {label:'Philanthropy',          c:{light:'#D97706',dark:'#FBBF24'},
              icon:'M2 6h20v12H2z M12 9a3 3 0 0 0 0 6 M6 12h.01 M18 12h.01',
              desc:'Foundations and funds financing a people-centered future for AI.'},
  policy:    {label:'Policy & Governance',   c:{light:'#64748B',dark:'#94A3B8'},
              icon:'M4 21h16 M12 3L4 9h16z M6 9v12M10 9v12M14 9v12M18 9v12',
              desc:'Institutes and intergovernmental bodies translating evidence into rules and norms.'},
  community: {label:'Community & Convening', c:{light:'#C026D3',dark:'#E879F9'},
              icon:'M4 5h16v10H9l-4 4V15H4z',
              desc:'Movements and platforms bringing practitioners and the public into the conversation.'},
};

/* ============================== flourishing areas (outer ring) ============================== */
const AREAS = {
  agency:    {label:'Comprehension & Agency',              color:'#0EA5E9',
              desc:'Understanding AI and staying in control of it — transparency, autonomy, and the capacity to act on one’s own judgment.'},
  wellbeing: {label:'Physical & Mental Wellbeing',         color:'#10B981',
              desc:'AI that protects and strengthens bodily and psychological health rather than eroding it.'},
  learning:  {label:'Curiosity & Learning',                color:'#6366F1',
              desc:'Technology that deepens knowledge, skills, and the joy of finding things out.'},
  creativity:{label:'Creativity & Expression',             color:'#EC4899',
              desc:'AI that expands — rather than replaces — human imagination, authorship, and voice.'},
  purpose:   {label:'Sense of Purpose',                    color:'#F59E0B',
              desc:'Meaning, direction, and character — a life that feels worth living in an AI-shaped world.'},
  social:    {label:'Healthy Relationships & Social Lives',color:'#14B8A6',
              desc:'Human connection, community, and healthy discourse in the age of AI companions and feeds.'},
};
const AREA_KEYS=Object.keys(AREAS);

/* ============================== seed data ============================== */
const SEED = {version:2, orgs:[
 {id:'aha', name:'MIT Media Lab — AHA Program', role:'hub', roles:['hub','academic','measure','community'],

let editMode=false, selected=null, hovered=null, query='', showProjects=true;
let showRing=true, selectedArea=null, hoveredArea=null, userMoved=false;
const RING_R=760, RING_W=26;

/* ---------- theme ---------- */
function themeName(){
  const dt=document.documentElement.dataset.theme;
  if(dt==='dark'||dt==='light') return dt;
  return matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';
}
const PALETTES={
  light:{bg:'#F7F9FA',dots:'#E9EFF0',edge:'#93A9AF',edgeSoft:'#BDCBCE',link:'#0D9488',
         ink:'#13272E',muted:'#63797F',labelBg:'rgba(247,249,250,.86)',ring:'#FFFFFF'},
  dark:{bg:'#0B1214',dots:'#162226',edge:'#52686E',edgeSoft:'#34464C',link:'#2DD4BF',
        ink:'#E9F2F3',muted:'#8FA5AB',labelBg:'rgba(11,18,20,.86)',ring:'#0B1214'},
};

/* ============================== graph ============================== */
let nodes=[], edges=[], nodeById={}, adj={};
const rand=(a,b)=>a+Math.random()*(b-a);

function buildGraph(){
  const old={}; nodes.forEach(n=>old[n.id]=n);
  nodes=[]; edges=[]; nodeById={}; adj={};
  const add=n=>{nodes.push(n);nodeById[n.id]=n;adj[n.id]=adj[n.id]||new Set();};
  const connect=(a,b)=>{adj[a.id].add(b.id);adj[b.id].add(a.id);};

  // central concept node
  {
    const prev=old['root'];
    add({id:'root',kind:'root',ref:{
      name:'AI × Human Flourishing',
      desc:'The movement to understand — and deliberately design — how artificial intelligence can support human wellbeing, agency, meaning, and connection. This atlas maps the research hubs, universities, labs, nonprofits, funders, and policy bodies shaping it.'},
      r:15, ax:0, ay:0,
      x:prev?prev.x:0, y:prev?prev.y:0, vx:0,vy:0});
  }
  const rootNode=nodeById['root'];

  // role anchor nodes (skip 'hub' — AHA links directly to the center)
  const roleKeys=Object.keys(ROLES).filter(k=>k!=='hub'&&data.orgs.some(o=>orgRoles(o).includes(k)));
  const R=470;
  roleKeys.forEach((k,i)=>{
    const ang=(i/roleKeys.length)*Math.PI*2 - Math.PI/2;
    const id='role:'+k;
    const prev=old[id];
    add({id,kind:'role',role:k,ref:{name:ROLES[k].label,desc:ROLES[k].desc},r:19,
      ax:Math.cos(ang)*R, ay:Math.sin(ang)*R,
      x:prev?prev.x:Math.cos(ang)*R, y:prev?prev.y:Math.sin(ang)*R, vx:0,vy:0});
  });

  // connection counts drive node size — highly connected orgs stand out
  const degree={};
  data.links.forEach(l=>{degree[l.a]=(degree[l.a]||0)+1;degree[l.b]=(degree[l.b]||0)+1;});
  data.orgs.forEach(o=>{
    const prev=old[o.id], pr=primaryRole(o), hub=pr==='hub';
    const deg=(degree[o.id]||0)+Math.max(0,orgRoles(o).length-1);
    const r=(hub?16:7)+Math.min(o.projects.length*.7,4)+Math.min(deg*1.1,8);
    const roleNode=nodeById['role:'+pr];
    const bx=hub?60:(roleNode?roleNode.ax:0), by=hub?-60:(roleNode?roleNode.ay:0);
    add({id:o.id,kind:'org',ref:o,r,deg,
      x:prev?prev.x:bx*.9+rand(-120,120), y:prev?prev.y:by*.9+rand(-120,120), vx:0,vy:0});
  });

  // root ↔ role spokes, root ↔ hub org
  roleKeys.forEach(k=>{
    const rn=nodeById['role:'+k];
    if(rn){edges.push({s:rootNode,t:rn,rest:R*.92,kind:'spine'});connect(rootNode,rn);}
  });
  const hubNode=nodeById[data.orgs.find(o=>primaryRole(o)==='hub')?.id];
  if(hubNode){edges.push({s:rootNode,t:hubNode,rest:150,kind:'spine'});connect(rootNode,hubNode);}
  // role ↔ org (every role an org belongs to)
  data.orgs.forEach(o=>{
    const n=nodeById[o.id];
    orgRoles(o).forEach((rk,ri)=>{
      const rn=nodeById['role:'+rk];
      if(n&&rn){edges.push({s:rn,t:n,rest:ri>0?320:150,kind:'role',secondary:ri>0});connect(rn,n);}
    });
  });
  // org ↔ project
  data.orgs.forEach(o=>{
    const n=nodeById[o.id];
    o.projects.forEach((p,j)=>{
      const prev=old[p.id];
      const pa=Math.atan2(n.y,n.x)+(j/(o.projects.length||1))*Math.PI*2;
      add({id:p.id,kind:'proj',ref:p,org:o,r:4,
        x:prev?prev.x:n.x+Math.cos(pa)*(n.r+40)+rand(-6,6),
        y:prev?prev.y:n.y+Math.sin(pa)*(n.r+40)+rand(-6,6),vx:0,vy:0});
      edges.push({s:n,t:nodeById[p.id],rest:n.r+30+(j%3)*8,kind:'proj'});
      connect(n,nodeById[p.id]);
    });
  });
  // shared projects: extra edges to collaborating orgs
  data.orgs.forEach(o=>{
    o.projects.forEach(p=>{
      (p.collab||[]).forEach(cid=>{
        const cn=nodeById[cid], pn=nodeById[p.id];
        if(cn&&pn&&cid!==o.id){edges.push({s:cn,t:pn,rest:cn.r+42,kind:'proj'});connect(cn,pn);}
      });
    });
  });
  // cross-org links
  data.links.forEach(l=>{
    const a=nodeById[l.a], b=nodeById[l.b];
    if(!a||!b) return;
    connect(a,b);
    edges.push({s:a,t:b,rest:340,kind:'link',label:l.label});
  });
  updateStats(); renderLegend();
}

function orgRoles(o){ return (o.roles&&o.roles.length)?o.roles:(o.role?[o.role]:['academic']); }
function primaryRole(o){ return orgRoles(o)[0]; }
function colorOf(n){
  if(n.kind==='root') return roleColor('hub');
  if(n.kind==='role') return roleColor(n.role);
  const o=n.kind==='org'?n.ref:n.org;
  return roleColor(primaryRole(o));
}
function rolesOfNode(n){ return n.kind==='role'?[n.role]:(n.kind==='org'?orgRoles(n.ref):orgRoles(n.org)); }
function nodeAreas(n){
  if(n.kind==='org') return n.ref.areas||[];
  if(n.kind==='proj') return (n.ref.areas&&n.ref.areas.length)?n.ref.areas:(n.org.areas||[]);
  return [];
}
function arcBounds(i){
  const gap=.05, span=Math.PI*2/AREA_KEYS.length;
  return [-Math.PI/2+i*span+gap, -Math.PI/2+(i+1)*span-gap];
}
function arcHit(px,py){
  if(!showRing) return null;
  const wx=(px-tx)/zk, wy=(py-ty)/zk, d=Math.hypot(wx,wy);
  if(Math.abs(d-RING_R)>RING_W) return null;
  const th=Math.atan2(wy,wx);
  for(let i=0;i<AREA_KEYS.length;i++){
    const [s,e]=arcBounds(i);
    let t=th; while(t<s) t+=Math.PI*2;
    if(t<=e) return AREA_KEYS[i];
  }
  return null;
}

function matches(n){
  if(!query) return true;
  const q=query.toLowerCase(), r=n.ref;
  const pool=[r.name,r.desc,(r.people||[]).join(' '),(r.tags||[]).join(' '),
    (r.keywords||[]).join(' '), r.location||''].join(' ').toLowerCase();
  return pool.includes(q);
}
function visible(n){
  if(n.kind==='root') return true;
  if(!rolesOfNode(n).some(r=>roleOn[r])) return false;
  if(!query) return true;
  if(n.kind==='role') return data.orgs.some(o=>orgRoles(o).includes(n.role)&&matches(nodeById[o.id]));
  if(n.kind==='org') return matches(n)||n.ref.projects.some(p=>matches(nodeById[p.id]));
  return matches(n)||matches(nodeById[n.org.id]);
}

/* ============================== physics ============================== */
let dragNode=null;
function step(){
  const N=nodes.length;
  for(let i=0;i<N;i++){const a=nodes[i];
    for(let j=i+1;j<N;j++){const b=nodes[j];
      let dx=b.x-a.x,dy=b.y-a.y,d2=dx*dx+dy*dy;
      if(d2<1){dx=rand(-1,1);dy=rand(-1,1);d2=1;}
      if(d2>300000)continue;
      const d=Math.sqrt(d2), rep=210*(a.r+b.r)/d2, fx=dx/d*rep, fy=dy/d*rep;
      a.vx-=fx;a.vy-=fy;b.vx+=fx;b.vy+=fy;
    }}
  for(const e of edges){
    let dx=e.t.x-e.s.x,dy=e.t.y-e.s.y;
    const d=Math.sqrt(dx*dx+dy*dy)||1;
    const k=e.kind==='proj'?0.05:e.kind==='role'?(e.secondary?0.006:0.025):e.kind==='spine'?0.02:0.004;
    const f=(d-e.rest)*k, fx=dx/d*f*.5, fy=dy/d*f*.5;
    e.s.vx+=fx;e.s.vy+=fy;e.t.vx-=fx;e.t.vy-=fy;
  }
  for(const n of nodes){
    if(n.kind==='root'){ n.vx+=(n.ax-n.x)*0.09; n.vy+=(n.ay-n.y)*0.09; }
    else if(n.kind==='role'){ n.vx+=(n.ax-n.x)*0.05; n.vy+=(n.ay-n.y)*0.05; }
    else if(n.kind==='org'){
      const g=n.ref.role==='hub'?0.008:0.0016;
      n.vx-=n.x*g; n.vy-=n.y*g;
    } else { n.vx-=n.x*0.0004; n.vy-=n.y*0.0004; }
    if(showRing&&n.kind!=='root'){
      const d=Math.hypot(n.x,n.y);
      if(d>RING_R-90){const f=(d-(RING_R-90))*0.004;n.vx-=n.x/d*f;n.vy-=n.y/d*f;}
    }
    if(n===dragNode){n.vx=0;n.vy=0;continue;}
    n.vx*=0.84;n.vy*=0.84;n.x+=n.vx;n.y+=n.vy;
  }
}

/* ============================== render ============================== */
const cv=document.getElementById('net'), ctx=cv.getContext('2d');
let W=0,H=0,dpr=1,tx=0,ty=0,zk=1;
function resize(){
  dpr=Math.min(devicePixelRatio||1,2);
  const oW=W,oH=H;
  W=innerWidth;H=innerHeight;
  cv.width=W*dpr;cv.height=H*dpr;cv.style.width=W+'px';cv.style.height=H+'px';
  if(oW){ if(showRing&&!userMoved)fitRing(); else {tx+=(W-oW)/2;ty+=(H-oH)/2;} }
}
addEventListener('resize',resize); resize();
tx=W/2; ty=H/2; zk=Math.max(.42,Math.min(1,Math.min(W,H)/1280));
function fitRing(){zk=Math.max(.24,Math.min(.9,Math.min(W,H)/(2*(RING_R+170))));tx=W/2;ty=H/2;}
if(showRing)fitRing();

function hexA(hex,a){
  const n=parseInt(hex.slice(1),16);
  return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`;
}
function curve(ax,ay,bx,by,bend){
  const mx=(ax+bx)/2, my=(ay+by)/2;
  const dx=bx-ax, dy=by-ay, d=Math.sqrt(dx*dx+dy*dy)||1;
  const ox=-dy/d*d*bend, oy=dx/d*d*bend;
  ctx.beginPath();ctx.moveTo(ax,ay);ctx.quadraticCurveTo(mx+ox,my+oy,bx,by);ctx.stroke();
}
const SANS='-apple-system,"SF Pro Text","Segoe UI",system-ui,sans-serif';
const iconCache={};
function drawIconScreen(d,cx,cy,size,color,alpha){
  let p=iconCache[d]; if(!p){p=new Path2D(d);iconCache[d]=p;}
  const s=size/24;
  ctx.save();
  ctx.globalAlpha=alpha;
  ctx.translate(cx,cy);ctx.scale(s,s);ctx.translate(-12,-12);
  ctx.strokeStyle=color;ctx.lineWidth=1.7/s;
  ctx.lineJoin='round';ctx.lineCap='round';
  ctx.stroke(p);
  ctx.restore();
}

function draw(){
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.fillStyle=PAL.bg;ctx.fillRect(0,0,W,H);
  // subtle dot grid
  const gs=26*zk<12?52*zk:26*zk;
  ctx.fillStyle=PAL.dots;
  const ox=tx%gs, oy=ty%gs;
  for(let x=ox;x<W;x+=gs)for(let y=oy;y<H;y+=gs){ctx.fillRect(x,y,1.5,1.5);}

  const focus=hovered||selected;
  const inFocus=id=>focus&&(id===focus.id||adj[focus.id]?.has(id));
  ctx.setTransform(dpr*zk,0,0,dpr*zk,dpr*tx,dpr*ty);
  ctx.lineCap='round';

  // flourishing ring: six arc segments + node→area threads
  if(showRing){
    ctx.lineCap='butt';
    for(let i=0;i<AREA_KEYS.length;i++){
      const k=AREA_KEYS[i], [s,e]=arcBounds(i), col=AREAS[k].color;
      const active=selectedArea===k||hoveredArea===k;
      ctx.beginPath();ctx.arc(0,0,RING_R,s,e);
      ctx.strokeStyle=hexA(col,active?.6:(selectedArea?.13:.25));
      ctx.lineWidth=active?RING_W+8:RING_W;
      ctx.stroke();
    }
    ctx.lineCap='round';
    for(const n of nodes){
      if(n.kind!=='org'&&n.kind!=='proj')continue;
      if(n.kind==='proj'&&!showProjects)continue;
      const list=nodeAreas(n); if(!list.length)continue;
      const isOrgN=n.kind==='org';
      for(const k of list){
        const i=AREA_KEYS.indexOf(k); if(i<0)continue;
        const [s,e]=arcBounds(i), col=AREAS[k].color;
        let th=Math.atan2(n.y,n.x); while(th<s)th+=Math.PI*2;
        const t=Math.min(Math.max(th,s+.05),e-.05);
        const ax=Math.cos(t)*(RING_R-RING_W/2-2), ay=Math.sin(t)*(RING_R-RING_W/2-2);
        let a=isOrgN?.16:.09, w=isOrgN?.9:.6;
        if(selectedArea===k){a=isOrgN?.5:.32;w=isOrgN?1.2:.9;}
        else if(selectedArea)a=.02;
        if(focus&&focus.id===n.id){a=.85;w=1.6;}
        else if(focus&&!inFocus(n.id))a=Math.min(a,.03);
        ctx.strokeStyle=hexA(col,a);ctx.lineWidth=w/zk;
        curve(n.x,n.y,ax,ay,.05);
      }
    }
  }

  // edges
  for(const e of edges){
    if(e.kind==='proj'&&!showProjects)continue;
    const vis=visible(e.s)&&visible(e.t);
    let a,w,col,bend=0,grad=null;
    if(e.kind==='proj'){a=.45;w=.8;col=colorOf(e.s);}
    else if(e.kind==='role'){a=.55;w=1.15;col=colorOf(e.s);bend=.06;}
    else if(e.kind==='spine'){a=.5;w=1.3;col=colorOf(e.t);bend=.04;}
    else{a=.7;w=1.5;col=PAL.link;bend=.13;grad=[colorOf(e.s),colorOf(e.t)];}
    if(!vis)a=.06;
    if(focus){
      const on=inFocus(e.s.id)&&inFocus(e.t.id)&&(e.s.id===focus.id||e.t.id===focus.id);
      if(on){a=1;w+=.7;col=e.kind==='link'?PAL.link:colorOf(e.s.kind==='role'?e.s:(e.t.kind==='role'?e.t:e.s));grad=null;}
      else a=Math.min(a,.09);
    }
    if(selectedArea&&!focus){
      const inA=x=>(x.kind==='org'||x.kind==='proj')&&nodeAreas(x).includes(selectedArea);
      if(!(inA(e.s)&&inA(e.t))) a=Math.min(a,.07);
    }
    if(grad){
      const g=ctx.createLinearGradient(e.s.x,e.s.y,e.t.x,e.t.y);
      g.addColorStop(0,hexA(grad[0],a));g.addColorStop(1,hexA(grad[1],a));
      ctx.strokeStyle=g;
    } else ctx.strokeStyle=hexA(col,a);
    ctx.lineWidth=w/zk;
    if(bend) curve(e.s.x,e.s.y,e.t.x,e.t.y,bend);
    else{ctx.beginPath();ctx.moveTo(e.s.x,e.s.y);ctx.lineTo(e.t.x,e.t.y);ctx.stroke();}
  }

  // nodes (projects under orgs under roles under root)
  const order={proj:0,org:1,role:2,root:3};
  const sorted=[...nodes].sort((a,b)=>(order[a.kind]-order[b.kind])||((a.ref.role==='hub')-(b.ref.role==='hub')));
  for(const n of sorted){
    if(n.kind==='proj'&&!showProjects)continue;
    const c=colorOf(n), vis=visible(n);
    let a=vis?1:0.12;
    if(focus&&!inFocus(n.id)) a=Math.min(a,.15);
    if(selectedArea&&!focus){
      if(n.kind==='org'||n.kind==='proj'){if(!nodeAreas(n).includes(selectedArea))a=Math.min(a,.12);}
      else a=Math.min(a,.5);
    }
    ctx.globalAlpha=a;
    const hot=n===hovered||n===selected;
    if(n.kind==='root'){
      ctx.beginPath();ctx.arc(n.x,n.y,n.r,0,7);
      ctx.fillStyle=hexA(c,.14);ctx.fill();
      ctx.lineWidth=(hot?3:2.4)/Math.sqrt(zk);ctx.strokeStyle=c;ctx.stroke();
      ctx.beginPath();ctx.arc(n.x,n.y,5,0,7);ctx.fillStyle=c;ctx.fill();
      ctx.beginPath();ctx.arc(n.x,n.y,n.r+6,0,7);
      ctx.strokeStyle=hexA(c,.3);ctx.lineWidth=1.2/zk;ctx.stroke();
    }else if(n.kind==='role'){
      const rr=Math.max(n.r,30/zk);
      ctx.beginPath();ctx.arc(n.x,n.y,rr,0,7);
      ctx.fillStyle=c;ctx.fill();
      ctx.lineWidth=(hot?3:2.2)/Math.sqrt(zk);ctx.strokeStyle=PAL.ring;ctx.stroke();
      ctx.beginPath();ctx.arc(n.x,n.y,rr+4/zk,0,7);
      ctx.strokeStyle=hexA(c,.5);ctx.lineWidth=1.2/zk;ctx.stroke();
    }else{
      ctx.beginPath();ctx.arc(n.x,n.y,n.r+(hot?1.5:0),0,7);
      ctx.fillStyle=c;ctx.fill();
      ctx.lineWidth=2/Math.sqrt(zk);ctx.strokeStyle=PAL.ring;ctx.stroke();
      if(n.ref.role==='hub'||n.deg>=4){
        ctx.beginPath();ctx.arc(n.x,n.y,n.r+5,0,7);
        ctx.strokeStyle=hexA(c,.35);ctx.lineWidth=1.4/zk;ctx.stroke();
      }
    }
    if(n===selected){
      const er=n.kind==='role'?Math.max(n.r,30/zk):n.r;
      ctx.beginPath();ctx.arc(n.x,n.y,er+(n.kind==='org'||n.kind==='proj'?5:8/zk),0,7);
      ctx.strokeStyle=hexA(c,.9);ctx.lineWidth=1.6/zk;ctx.stroke();
    }
  }
  ctx.globalAlpha=1;

  // labels (screen space) — all visible, sized by hierarchy: root > role > org > project
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.textAlign='center';
  for(const n of sorted){
    const kind=n.kind;
    if(kind==='proj'&&!showProjects)continue;
    const vis=visible(n);
    let a=vis?1:.12;
    if(focus&&!inFocus(n.id))a=Math.min(a,.12);
    if(selectedArea&&!focus){
      if(kind==='org'||kind==='proj'){if(!nodeAreas(n).includes(selectedArea))a=Math.min(a,.1);}
      else a=Math.min(a,.55);
    }
    const offset=kind==='root'?26:kind==='role'?22:kind==='org'?13:9;
    const rEff=kind==='role'?Math.max(n.r*zk,30):n.r*zk;
    const sx=n.x*zk+tx;
    const sy=kind==='root'? n.y*zk+ty-rEff-16 : n.y*zk+ty+rEff+offset;
    if(sx<-220||sx>W+220||sy<-40||sy>H+40)continue;
    if(kind==='role'){
      const cx=n.x*zk+tx, cy=n.y*zk+ty;
      const sr=Math.max(n.r*zk,30), isz=Math.min(42,sr*1.0);
      drawIconScreen(ROLES[n.role].icon,cx,cy,isz,PAL.ring,a);
    }
    let label=n.ref.name, font, fill, boxH=15;
    if(kind==='root'){
      font='800 20px '+SANS;fill=colorOf(n);ctx.letterSpacing='0.3px';boxH=23;}
    else if(kind==='role'){label=label.toUpperCase();
      font='750 16px '+SANS;fill=colorOf(n);ctx.letterSpacing='1.6px';boxH=20;}
    else if(kind==='org'){
      const hub=n.ref.role==='hub';
      const boost=Math.min(n.ref.projects.length*.125+(n.deg||0)*.225,1.75);
      const zb=Math.min(2,Math.max(1,zk/.55));
      const fs=((hub?7.5:6.5)+boost)*zb;
      font=(boost>.9?'680 ':'570 ')+fs.toFixed(1)+'px '+SANS;
      fill=PAL.ink;ctx.letterSpacing='0px';boxH=fs+4;}
    else{
      const zb=Math.min(2,Math.max(1,zk/.55));
      const pfs=4.25*zb;
      font='400 '+pfs.toFixed(1)+'px '+SANS;fill=PAL.muted;ctx.letterSpacing='0px';boxH=pfs+4;}
    ctx.font=font;
    const tw=ctx.measureText(label).width;
    ctx.globalAlpha=a;
    ctx.fillStyle=PAL.labelBg;
    ctx.fillRect(sx-tw/2-4,sy-boxH+4,tw+8,boxH);
    ctx.fillStyle=fill;
    ctx.fillText(label,sx,sy+3);
  }
  // ring segment labels
  if(showRing){
    for(let i=0;i<AREA_KEYS.length;i++){
      const k=AREA_KEYS[i], [s,e]=arcBounds(i), mid=(s+e)/2, col=AREAS[k].color;
      const lx=Math.cos(mid)*(RING_R+64)*zk+tx, ly=Math.sin(mid)*(RING_R+64)*zk+ty;
      if(lx<-260||lx>W+260||ly<-60||ly>H+60)continue;
      const active=selectedArea===k||hoveredArea===k;
      ctx.font=(active?'800 13px ':'750 12.5px ')+SANS;ctx.letterSpacing='1.1px';
      ctx.globalAlpha=selectedArea&&!active?.35:1;
      const parts=AREAS[k].label.toUpperCase().split(' & ');
      parts.forEach((ln,li)=>{
        const txt=(li===0&&parts.length>1)?ln+' &':ln;
        const yy=ly+(li-(parts.length-1)/2)*16;
        const tw=ctx.measureText(txt).width;
        ctx.fillStyle=PAL.labelBg;ctx.fillRect(lx-tw/2-4,yy-10,tw+8,15);
        ctx.fillStyle=col;ctx.fillText(txt,lx,yy+2);
      });
    }
    ctx.globalAlpha=1;
  }
  ctx.letterSpacing='0px';
  ctx.globalAlpha=1;
}

/* ============================== interaction ============================== */
const toScreen=n=>({x:n.x*zk+tx,y:n.y*zk+ty});
function hitTest(px,py){
  const wx=(px-tx)/zk, wy=(py-ty)/zk;
  let best=null,bd=1e9;
  for(const n of nodes){
    if(n.kind==='proj'&&!showProjects)continue;
    const er=n.kind==='role'?Math.max(n.r,30/zk):n.r;
    const d=Math.hypot(n.x-wx,n.y-wy), lim=er+7/zk;
    if(d<lim&&d<bd){best=n;bd=d;}
  }
  return best;
}
const pointers=new Map();
let panStart=null, dragMoved=0, pinch0=null;
cv.addEventListener('pointerdown',e=>{
  try{cv.setPointerCapture(e.pointerId);}catch(err){}
  pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pointers.size===2){
    const[p1,p2]=[...pointers.values()];
    pinch0={d:Math.hypot(p1.x-p2.x,p1.y-p2.y),k:zk,mx:(p1.x+p2.x)/2,my:(p1.y+p2.y)/2,tx,ty};
    dragNode=null;panStart=null;return;
  }
  dragMoved=0;
  const n=hitTest(e.clientX,e.clientY);
  if(n){dragNode=n;}
  else{panStart={x:e.clientX,y:e.clientY,tx,ty};cv.classList.add('grabbing');}
});
cv.addEventListener('pointermove',e=>{
  if(pointers.has(e.pointerId)){
    const p=pointers.get(e.pointerId);
    dragMoved+=Math.hypot(e.clientX-p.x,e.clientY-p.y);
    p.x=e.clientX;p.y=e.clientY;
  }
  if(pointers.size===2&&pinch0){
    const[p1,p2]=[...pointers.values()];
    const d=Math.hypot(p1.x-p2.x,p1.y-p2.y);
    userMoved=true;
    const nk=Math.min(3,Math.max(.3,pinch0.k*d/pinch0.d));
    const mx=(p1.x+p2.x)/2,my=(p1.y+p2.y)/2;
    tx=mx-(pinch0.mx-pinch0.tx)*nk/pinch0.k;
    ty=my-(pinch0.my-pinch0.ty)*nk/pinch0.k;
    zk=nk;return;
  }
  if(dragNode){
    userMoved=true;dragNode.x=(e.clientX-tx)/zk;dragNode.y=(e.clientY-ty)/zk;return;
  }
  if(panStart){
    if(dragMoved>4)userMoved=true;
    tx=panStart.tx+(e.clientX-panStart.x);
    ty=panStart.ty+(e.clientY-panStart.y);return;
  }
  const n=hitTest(e.clientX,e.clientY);
  hovered=n;
  hoveredArea=n?null:arcHit(e.clientX,e.clientY);
  cv.classList.toggle('pointing',!!n||!!hoveredArea);
});
function endPointer(e){
  pointers.delete(e.pointerId);
  if(pointers.size<2)pinch0=null;
  cv.classList.remove('grabbing');
  if(dragNode&&dragMoved<5){select(dragNode);}
  else if(!dragNode&&panStart&&dragMoved<5){
    const ah=arcHit(e.clientX,e.clientY);
    if(ah)selectArea(ah); else select(null);
  }
  dragNode=null;panStart=null;
}
cv.addEventListener('pointerup',endPointer);
cv.addEventListener('pointercancel',endPointer);
cv.addEventListener('wheel',e=>{
  e.preventDefault();userMoved=true;
  const nk=Math.min(3,Math.max(.3,zk*Math.exp(-e.deltaY*.0013)));
  tx=e.clientX-(e.clientX-tx)*nk/zk;
  ty=e.clientY-(e.clientY-ty)*nk/zk;
  zk=nk;
},{passive:false});

  if(!on&&overlayView==='table')closeOverlay();
  else if(overlayView)refreshOverlay();
  if(selected)renderPanel(selected);
}

/* ---- forms ---- */
const slug=s=>s.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')
  +'-'+Date.now().toString(36).slice(-4);
const splitCsv=s=>s.split(',').map(x=>x.trim()).filter(Boolean);
const areaChecks=sel=>`<div class="field"><label>Flourishing areas</label><div class="checks">${
  Object.entries(AREAS).map(([k,a])=>`<label class="check"><input type="checkbox" data-area="${k}" ${
    (sel||[]).includes(k)?'checked':''}> ${a.label}</label>`).join('')}</div></div>`;
const readAreas=()=>[...modal.querySelectorAll('[data-area]:checked')].map(c=>c.dataset.area);

function orgForm(existing){
  const o=existing||{};
  openModal(`<span class="eyebrow">${existing?'Edit organization':'New organization'}</span>
    <h3>${existing?esc(o.name):'Add an organization'}</h3>
    <div class="field"><label>Name *</label><input id="fName" value="${esc(o.name||'')}"></div>
    <div class="field"><label>Primary role</label><select id="fRole">${
      Object.entries(ROLES).filter(([k])=>k!=='hub'||primaryRole(o)==='hub')
      .map(([k,rr])=>`<option value="${k}" ${primaryRole(o)===k?'selected':''}>${rr.label}</option>`).join('')}</select></div>
    <div class="field"><label>Additional roles (an org can play several)</label><div class="checks">${
      Object.entries(ROLES).filter(([k])=>k!=='hub').map(([k,rr])=>`<label class="check"><input type="checkbox" data-role="${k}" ${
        orgRoles(o).slice(1).includes(k)?'checked':''}> ${rr.label}</label>`).join('')}</div></div>
    <div class="field"><label>Location</label><input id="fLoc" value="${esc(o.location||'')}" placeholder="City, Country"></div>
    <div class="field"><label>Website</label><input id="fUrl" value="${esc(o.url||'')}" placeholder="https://…"></div>
    <div class="field"><label>Description</label><textarea id="fDesc">${esc(o.desc||'')}</textarea></div>
    <div class="field"><label>People (comma-separated)</label><input id="fPeople" value="${esc((o.people||[]).join(', '))}"></div>
    <div class="field"><label>Tags (comma-separated)</label><input id="fTags" value="${esc((o.tags||[]).join(', '))}"></div>
    <div class="field"><label>Keywords (comma-separated)</label><input id="fKw" value="${esc((o.keywords||[]).join(', '))}"></div>
    ${areaChecks(o.areas)}
    <div class="ferr" id="fErr">Name is required.</div>
    <div class="mrow"><button class="btn" id="mNo">Cancel</button>
    <button class="btn primary" id="mGo">${existing?'Save changes':'Add to map'}</button></div>`);
  modal.querySelector('#mNo').onclick=closeModal;
  modal.querySelector('#mGo').onclick=()=>{
    const name=modal.querySelector('#fName').value.trim();
    if(!name){modal.querySelector('#fErr').style.display='block';return;}
    const primary=modal.querySelector('#fRole').value;
    const extra=[...modal.querySelectorAll('[data-role]:checked')].map(c=>c.dataset.role).filter(k=>k!==primary);
    const v={name,role:primary,roles:[primary,...extra],
      location:modal.querySelector('#fLoc').value.trim(),
      url:modal.querySelector('#fUrl').value.trim(),
      desc:modal.querySelector('#fDesc').value.trim(),
      people:splitCsv(modal.querySelector('#fPeople').value),
      tags:splitCsv(modal.querySelector('#fTags').value),
      keywords:splitCsv(modal.querySelector('#fKw').value),
      areas:readAreas()};
    if(existing)Object.assign(existing,v);
    else data.orgs.push({id:slug(name),projects:[],...v});
    closeModal();afterMutate();
    const node=nodeById[existing?existing.id:data.orgs[data.orgs.length-1].id];
    if(node)select(node);
    toast(existing?'Saved':'Organization added');
  };
}
function projForm(org,existing){
  const p=existing||{};
  openModal(`<span class="eyebrow">${existing?'Edit project':'New project'} · ${esc(org.name)}</span>
    <h3>${existing?esc(p.name):'Add a project'}</h3>
    <div class="field"><label>Name *</label><input id="fName" value="${esc(p.name||'')}"></div>
    <div class="field"><label>Description</label><textarea id="fDesc">${esc(p.desc||'')}</textarea></div>
    <div class="field"><label>People (comma-separated)</label><input id="fPeople" value="${esc((p.people||[]).join(', '))}"></div>
    <div class="field"><label>Tags (comma-separated)</label><input id="fTags" value="${esc((p.tags||[]).join(', '))}"></div>
    <div class="field"><label>Link</label><input id="fUrl" value="${esc(p.url||'')}" placeholder="https://…"></div>
    ${areaChecks(p.areas)}
    <div class="field"><label>Collaborating organizations (⌘/Ctrl-click for multiple)</label>
      <select id="fCollab" multiple size="5">${
        data.orgs.filter(o=>o.id!==org.id).map(o=>`<option value="${esc(o.id)}" ${
          (p.collab||[]).includes(o.id)?'selected':''}>${esc(o.name)}</option>`).join('')}</select></div>
    <div class="ferr" id="fErr">Name is required.</div>
    <div class="mrow"><button class="btn" id="mNo">Cancel</button>
    <button class="btn primary" id="mGo">${existing?'Save changes':'Add project'}</button></div>`);
  modal.querySelector('#mNo').onclick=closeModal;
  modal.querySelector('#mGo').onclick=()=>{
    const name=modal.querySelector('#fName').value.trim();
    if(!name){modal.querySelector('#fErr').style.display='block';return;}
    const v={name,desc:modal.querySelector('#fDesc').value.trim(),
      people:splitCsv(modal.querySelector('#fPeople').value),
      tags:splitCsv(modal.querySelector('#fTags').value),
      url:modal.querySelector('#fUrl').value.trim(),
      areas:readAreas(),
      collab:[...modal.querySelector('#fCollab').selectedOptions].map(op=>op.value)};
    if(existing)Object.assign(existing,v);
    else org.projects.push({id:slug(name),...v});
    closeModal();afterMutate();select(nodeById[org.id]);
    toast(existing?'Saved':'Project added');
  };
}
function linkForm(org){
  const others=data.orgs.filter(o=>o.id!==org.id);
  openModal(`<span class="eyebrow">New connection · ${esc(org.name)}</span>
    <h3>Connect to another organization</h3>
    <div class="field"><label>Organization</label><select id="fTo">${
      others.map(o=>`<option value="${esc(o.id)}">${esc(o.name)}</option>`).join('')}</select></div>
    <div class="field"><label>Relationship label</label><input id="fLbl" placeholder="e.g. Joint research, Funding"></div>
    <div class="mrow"><button class="btn" id="mNo">Cancel</button>
    <button class="btn primary" id="mGo">Connect</button></div>`);
  modal.querySelector('#mNo').onclick=closeModal;
  modal.querySelector('#mGo').onclick=()=>{
    data.links.push({a:org.id,b:modal.querySelector('#fTo').value,
      label:modal.querySelector('#fLbl').value.trim()||'connection'});
    closeModal();afterMutate();select(nodeById[org.id]);toast('Connection added');
  };
}

/* ============================== overlay views ============================== */
let overlayView=null;
let tblQuery='', tblRole='', tblArea='', tblSort='projects', tblDir=-1;
const overlayEl=document.getElementById('overlay');
function projCount(o){
  let n=o.projects.length;
  data.orgs.forEach(o2=>{if(o2.id!==o.id)o2.projects.forEach(p=>{if((p.collab||[]).includes(o.id))n++;});});
  return n;
}
function orgAdjacency(){
  const adj={};data.orgs.forEach(o=>adj[o.id]=new Set());
  data.links.forEach(l=>{if(adj[l.a]&&adj[l.b]){adj[l.a].add(l.b);adj[l.b].add(l.a);}});
  data.orgs.forEach(o=>o.projects.forEach(p=>(p.collab||[]).forEach(c=>{
    if(adj[o.id]&&adj[c]){adj[o.id].add(c);adj[c].add(o.id);}
  })));
  return adj;
}
function openNodeFromOverlay(id){closeOverlay();const t=nodeById[id];if(t)select(t);}
function openOverlay(view){
  overlayView=view;overlayEl.classList.add('open');
  if(view==='table')renderTable();else renderPathway();
}
function closeOverlay(){overlayEl.classList.remove('open');overlayView=null;}
function refreshOverlay(){if(overlayView==='table')renderTable();else if(overlayView==='pathway')renderPathway();}
document.getElementById('ovClose').addEventListener('click',closeOverlay);
document.getElementById('tableBtn').addEventListener('click',()=>openOverlay('table'));
document.getElementById('pathwayBtn').addEventListener('click',()=>openOverlay('pathway'));

/* ---- table editor ---- */
function renderTable(){
  document.getElementById('ovEyebrow').textContent='Editable directory';
  document.getElementById('ovTitle').textContent='Organizations — Table Editor';
  document.getElementById('overlayTools').innerHTML = editMode
    ?'<button class="btn primary" id="tAdd">＋ Add organization</button>'
    :'<button class="btn" id="tUnlock">🔓 Unlock editing</button>';
  const linkDeg={};data.links.forEach(l=>{linkDeg[l.a]=(linkDeg[l.a]||0)+1;linkDeg[l.b]=(linkDeg[l.b]||0)+1;});
  let rows=data.orgs.filter(o=>{
    if(tblRole&&!orgRoles(o).includes(tblRole))return false;
    if(tblArea&&!(o.areas||[]).includes(tblArea))return false;
    if(tblQuery){const q=tblQuery.toLowerCase();
      if(![o.name,o.desc,(o.people||[]).join(' '),(o.tags||[]).join(' '),o.location].join(' ').toLowerCase().includes(q))return false;}
    return true;
  });
  const val=o=>({name:o.name.toLowerCase(),role:(ROLES[primaryRole(o)]||{}).label||'',
    location:(o.location||'').toLowerCase(),projects:projCount(o),connections:linkDeg[o.id]||0}[tblSort]);
  rows.sort((a,b)=>{const x=val(a),y=val(b);return (x<y?-1:x>y?1:0)*tblDir;});
  const th=(k,lbl,cls)=>`<th data-sort="${k}" class="${cls||''}">${lbl}${tblSort===k?(tblDir>0?' ▲':' ▼'):''}</th>`;
  const areaOpts=['<option value="">All areas</option>'].concat(Object.entries(AREAS).map(([k,a])=>`<option value="${k}" ${tblArea===k?'selected':''}>${a.label}</option>`)).join('');
  const roleOpts=['<option value="">All roles</option>'].concat(Object.entries(ROLES).map(([k,r])=>`<option value="${k}" ${tblRole===k?'selected':''}>${r.label}</option>`)).join('');
  let html=`<div class="tbar">
    <input id="tSearch" type="search" placeholder="Search organizations…" value="${esc(tblQuery)}" style="min-width:200px">
    <select id="tRole">${roleOpts}</select>
    <select id="tArea">${areaOpts}</select>
    ${(tblQuery||tblRole||tblArea)?'<button class="btn" id="tClear">Clear filters</button>':''}
    <span class="tcount">${rows.length} of ${data.orgs.length} organizations</span>
  </div>
  <div style="overflow-x:auto"><table class="otable"><thead><tr>
    ${th('name','Organization')}${th('role','Roles')}${th('location','Location')}
    <th>Flourishing areas</th>${th('projects','Projects','tnum')}${th('connections','Connections','tnum')}
    ${editMode?'<th></th>':''}
  </tr></thead><tbody>`;
  rows.forEach(o=>{
    html+=`<tr>
      <td><span class="oname" data-open="${esc(o.id)}">${esc(o.name)}</span></td>
      <td><div class="rolepills">${orgRoles(o).map(rk=>`<span class="rolepill" style="background:${roleColor(rk)}">${esc((ROLES[rk]||{}).label||rk)}</span>`).join('')}</div></td>
      <td style="color:var(--muted);font-size:11.5px">${esc(o.location||'—')}</td>
      <td><div class="rolepills">${(o.areas||[]).map(k=>AREAS[k]?`<span class="areapill" style="color:${AREAS[k].color};background:${AREAS[k].color}1A">${esc(AREAS[k].label)}</span>`:'').join('')||'<span style="color:var(--faint)">—</span>'}</div></td>
      <td class="tnum">${projCount(o)}</td>
      <td class="tnum">${linkDeg[o.id]||0}</td>
      ${editMode?`<td style="white-space:nowrap"><button class="ticon" data-edit="${esc(o.id)}" title="Edit">✎</button><button class="ticon del" data-del="${esc(o.id)}" title="Delete">✕</button></td>`:''}
    </tr>`;
  });
  html+='</tbody></table></div>';
  const body=document.getElementById('overlayBody');body.innerHTML=html;
  body.querySelectorAll('[data-open]').forEach(el=>el.addEventListener('click',()=>openNodeFromOverlay(el.dataset.open)));
  body.querySelectorAll('th[data-sort]').forEach(el=>el.addEventListener('click',()=>{
    const k=el.dataset.sort;if(tblSort===k)tblDir*=-1;else{tblSort=k;tblDir=(k==='projects'||k==='connections')?-1:1;}renderTable();
  }));
  const si=body.querySelector('#tSearch');si.addEventListener('input',()=>{tblQuery=si.value;const p=si.selectionStart;renderTable();const n=document.querySelector('#tSearch');if(n){n.focus();n.setSelectionRange(p,p);}});
  body.querySelector('#tRole').addEventListener('change',e=>{tblRole=e.target.value;renderTable();});
  body.querySelector('#tArea').addEventListener('change',e=>{tblArea=e.target.value;renderTable();});
  const tc=body.querySelector('#tClear');if(tc)tc.addEventListener('click',()=>{tblQuery=tblRole=tblArea='';renderTable();});
  body.querySelectorAll('[data-edit]').forEach(el=>el.addEventListener('click',()=>orgForm(data.orgs.find(o=>o.id===el.dataset.edit))));
  body.querySelectorAll('[data-del]').forEach(el=>el.addEventListener('click',()=>{
    const o=data.orgs.find(x=>x.id===el.dataset.del);
    confirmModal(`Delete “${o.name}” and all its projects and connections?`,()=>{
      data.orgs=data.orgs.filter(x=>x.id!==o.id);
      data.links=data.links.filter(l=>l.a!==o.id&&l.b!==o.id);
      afterMutate();toast('Deleted');
    });
  }));
  const ta=document.getElementById('tAdd');if(ta)ta.addEventListener('click',()=>orgForm(null));
  const tu=document.getElementById('tUnlock');if(tu)tu.addEventListener('click',()=>document.getElementById('editBtn').click());
}

/* ---- pathway to impact ---- */
const PATHWAY=[
  {roles:['funder'],       title:'Philanthropy',       sub:'Capital fuels the field'},
  {roles:['hub','academic'],title:'Research',          sub:'Evidence & ideas'},
  {roles:['measure'],      title:'Measurement & Data', sub:'Benchmarks & metrics'},
  {roles:['civil'],        title:'Civil Society',      sub:'Advocacy & public interest'},
  {roles:['industry'],     title:'Companies & Labs',   sub:'Building & deployment'},
  {roles:['policy'],       title:'Policy & Governance',sub:'Rules & norms'},
  {roles:['community'],    title:'Community',           sub:'Movement & culture'},
];
function renderPathway(){
  document.getElementById('ovEyebrow').textContent='Systemic view';
  document.getElementById('ovTitle').textContent='Pathway to Impact';
  document.getElementById('overlayTools').innerHTML='';
  const adj=orgAdjacency();
  let html=`<p class="pathnote">How work on AI &amp; human flourishing flows from funding to lasting impact. Each column is a stage in the ecosystem; the number on each organization is how many projects it runs on AI &amp; human flourishing. Hover an organization to trace its connections across stages; click to open it in the map.</p><div style="overflow-x:auto"><div class="pathgrid">`;
  PATHWAY.forEach((stage,si)=>{
    const rk=stage.roles[0], col=roleColor(rk), ic=ROLES[rk].icon;
    let orgs=data.orgs.filter(o=>stage.roles.some(r=>orgRoles(o).includes(r)));
    orgs.sort((a,b)=>projCount(b)-projCount(a));
    const totalProj=orgs.reduce((s,o)=>s+projCount(o),0);
    html+=`<div class="pathcol">
      <h3><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="${col}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="${ic}"/></svg>${esc(stage.title)}</h3>
      <div class="stagesub">${esc(stage.sub)}</div>
      <div class="stagestat">${orgs.length} orgs · ${totalProj} projects</div>
      <div class="pathlist">`+
      orgs.map(o=>`<button class="pathitem" data-id="${esc(o.id)}">
        <span class="pdot" style="background:${roleColor(primaryRole(o))}"></span>
        <span class="pnm">${esc(o.name)}</span>
        <span class="pj" title="Projects on AI &amp; human flourishing">${projCount(o)}</span>
      </button>`).join('')+`</div></div>`;
    if(si<PATHWAY.length-1) html+=`<div class="pathstep"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></div>`;
  });
  html+='</div></div>';
  const body=document.getElementById('overlayBody');body.innerHTML=html;
  const items=[...body.querySelectorAll('.pathitem')];
  items.forEach(el=>{
    el.addEventListener('click',()=>openNodeFromOverlay(el.dataset.id));
    el.addEventListener('mouseenter',()=>{
      const id=el.dataset.id, near=adj[id]||new Set();
      items.forEach(it=>{
        const iid=it.dataset.id;
        if(iid===id)it.classList.add('hot');
        else if(near.has(iid))it.classList.add('hot');
        else it.classList.add('dim');
      });
    });
    el.addEventListener('mouseleave',()=>items.forEach(it=>it.classList.remove('hot','dim')));
  });
}

q.addEventListener('input',()=>{query=q.value.trim();});
addEventListener('keydown',e=>{
  if(e.key==='Escape'){
    if(scrim.classList.contains('open'))closeModal();

    else if(selected||selectedArea)select(null);
    else if(query){q.value='';query='';}

  if(e.key==='/'&&document.activeElement!==q&&!scrim.classList.contains('open')){
    e.preventDefault();q.focus();
  }
});
